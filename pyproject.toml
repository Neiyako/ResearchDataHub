[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "researchdatahub"
version = "1.1.0"
description = "Research Data Acquisition and Synchronization Hub — 面向气候与地球科学的多源科研数据采集基础设施"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "ResearchDataHub contributors" }]
keywords = [
  "climate",
  "earth-science",
  "data-acquisition",
  "era5",
  "cmip6",
  "reanalysis",
  "cdsapi",
  "ncar",
  "data-integrity",
  "provenance",
  "reproducibility",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "boto3>=1.34",
]

[project.optional-dependencies]
# CDS 模式数据（ERA5 的 Copernicus 访问路径）需要 cdsapi。
cds = ["cdsapi>=0.7"]
# 科学数据检查（能力：NetCDF 可打开性、变量存在性、时间覆盖）需要 xarray 栈。
sci = ["xarray>=2024.3", "netCDF4>=1.6"]
# MCP Server（面向外部 AI Coding Agent 的唯一正式执行接口）使用官方 MCP Python SDK 的
# stdio 传输。SDK 缺席时 server 模块仍可导入，调用会返回结构化 not_available。
mcp = ["mcp>=1.2"]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
]

[project.scripts]
rdh = "researchdatahub.cli.main:app"
rdh-mcp = "researchdatahub.interfaces.mcp.server:main"

[project.urls]
Homepage = "https://github.com/Neiyako/ResearchDataHub"
Repository = "https://github.com/Neiyako/ResearchDataHub"
Issues = "https://github.com/Neiyako/ResearchDataHub/issues"
Changelog = "https://github.com/Neiyako/ResearchDataHub/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Neiyako/ResearchDataHub/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/researchdatahub"]

# 配置文件与示例随源码分发包一起提供，便于 `rdh config validate` 在安装后找到默认样例。
[tool.hatch.build.targets.sdist]
include = [
  "src/researchdatahub",
  "configs",
  "examples",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN", "D", "PT", "TID", "C4"]
ignore = [
  "ANN401",   # 受控的 JsonValue 需要行内 all
  "D203",     # 与 D211 冲突
  "D213",     # 与 D212 冲突（采用 D212：首行即摘要）
  "RUF001",   # 中文全角标点在 docstring 中是刻意的
  "RUF002",
  "RUF003",
  "D400",     # 中文句末为全角句号，D400 按英文句号判定，误报
  "D415",
  "D205",
  "D401",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "S101", "PLC0415"]
"src/researchdatahub/cli/**/*.py" = ["D"]
"docs/**/*" = ["D"]
# 配置加载器只对私有内部函数关闭缺 docstring 检查（公共 API 均有 docstring）；
# ANN 规则对 config 包同样生效，不存在特例。
"src/researchdatahub/config/loader.py" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
# 默认套件不跑真实外网测试：network 用例用 `pytest -m network` 显式触发。
# 理由：默认套件必须可离线、可重复；把外网抖动算进 CI 红/绿会让"测试通过"失去意义。
addopts = "-q --strict-markers --strict-config -m 'not network'"
markers = [
  "network: 需要外网的测试（默认不跑：pytest -m network）",
  "integration: 集成测试（真实 CLI 子进程）",
]
pythonpath = ["src", "."]
filterwarnings = ["error::DeprecationWarning:researchdatahub.*"]

[tool.coverage.run]
source = ["researchdatahub"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["researchdatahub"]
strict = true
warn_unreachable = true
disallow_any_explicit = false
warn_unused_ignores = true
# 第三方库缺少类型标注时的策略：PyYAML 官方不发布 stub，依赖清单里也不引入 types-PyYAML
# （运行时不需要）。因此关闭 import-untyped 这一个错误码；代码里不放行内 type: ignore，
# 保持 warn_unused_ignores 能真实发现“多余抑制”。
# 取舍：M1 若引入真正无类型的第三方库，需要在此处补一行说明，而不是悄悄放行。
disable_error_code = ["import-untyped"]
