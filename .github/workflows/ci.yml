name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cds,sci]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check (strict)
        run: mypy src

      - name: Offline test suite (network excluded)
        run: |
          python -m pytest -o addopts="" -m "not network" -q \
            || python -m pytest -o addopts="" -m "not network" -q --lf
        # 允许一次失败重跑：仅吸收已知时序抖动（见 docs/testing-strategy.md §12），
        # 真回归仍会在重跑后失败并把 CI 标红。

  coverage:
    name: coverage (ubuntu / py3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,cds,sci]"

      - name: Coverage
        run: |
          python -m pytest -o addopts="" -m "not network" --cov=researchdatahub --cov-report=term-missing --cov-report=xml \
            || python -m pytest -o addopts="" -m "not network" --cov=researchdatahub --cov-report=term-missing --cov-report=xml --lf

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
