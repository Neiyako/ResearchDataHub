name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev)
        run: |
          python -m pip install --upgrade pip
          # mcp 是可选依赖：MCP Server 集成测试需要它（缺了会 ModuleNotFoundError）
          pip install -e ".[dev,cds,sci,mcp]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Type check (strict)
        run: mypy src

      - name: Offline test suite (network excluded)
        run: |
          python -m pytest -o addopts="" -m "not network" -q --tb=short
        # 不做"失败自动重跑"：重跑会掩盖真实的不稳定测试。
        # 已知的偶发抖动（本地 HTTP 服务器的连接时序）记录在 docs/testing-strategy.md §12，
        # 修复方向是让测试自身等待就绪，而不是在 CI 里重试。

  coverage:
    name: coverage (ubuntu / py3.13)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install (dev)
        run: |
          python -m pip install --upgrade pip
          # mcp 是可选依赖：MCP Server 集成测试需要它（缺了会 ModuleNotFoundError）
          pip install -e ".[dev,cds,sci,mcp]"

      - name: Coverage
        run: |
          python -m pytest -o addopts="" -m "not network" --tb=short \
            --cov=researchdatahub --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
